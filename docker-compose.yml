services:

  # ─── INFRAESTRUTURA ───────────────────────────────────────────

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092


  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Strong@Pass123"
      MSSQL_PID: Developer
    volumes:
      - sqldata:/var/lib/mssql/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Strong@Pass123 -Q 'SELECT 1' -No"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ─── SERVIÇOS .NET ────────────────────────────────────────────

  orders-api:
    build:
      context: .
      dockerfile: ./services/OrdersApi/Dockerfile
    ports:
      - "5001:8080"
    depends_on:
      kafka:
        condition: service_healthy
      sqlserver:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: Data Source=10.1.1.221,42357;Initial Catalog=teste_antonio;Persist Security Info=True;User ID=ui_cn_entity;Password=oebmmvc;MultipleActiveResultSets=True;Encrypt=True;TrustServerCertificate=True;
      Kafka__BootstrapServers: kafka:9092

  payments-api:
    build:
      context: .
      dockerfile: ./services/PaymentsApi/Dockerfile
    ports:
      - "5002:8080"
    depends_on:
      kafka:
        condition: service_healthy
      sqlserver:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: Data Source=10.1.1.221,42357;Initial Catalog=teste_antonio;Persist Security Info=True;User ID=ui_cn_entity;Password=oebmmvc;MultipleActiveResultSets=True;Encrypt=True;TrustServerCertificate=True;
      Kafka__BootstrapServers: kafka:9092

  stock-api:
    build:
      context: .
      dockerfile: ./services/StockApi/Dockerfile
    ports:
      - "5003:8080"
    depends_on:
      kafka:
        condition: service_healthy
      sqlserver:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: Data Source=10.1.1.221,42357;Initial Catalog=teste_antonio;Persist Security Info=True;User ID=ui_cn_entity;Password=oebmmvc;MultipleActiveResultSets=True;Encrypt=True;TrustServerCertificate=True;
      Kafka__BootstrapServers: kafka:9092

  notifications-api:
    build:
      context: .
      dockerfile: ./services/NotificationsApi/Dockerfile
    ports:
      - "5004:8080"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Kafka__BootstrapServers: kafka:9092

  # ─── FRONTEND ─────────────────────────────────────────────────

  angular-app:
    build:
      context: ./frontend/front-app
      dockerfile: Dockerfile
    ports:
      - "4200:4200"
    depends_on:
      - orders-api

# ─── VOLUMES ──────────────────────────────────────────────────

volumes:
  sqldata: