<div class="register-container">
    <div class="register-card">
        <h1>Cadastro</h1>
        <p class="subtitle">Crie sua conta</p>

        <form [formGroup]="form">
            <div class="form-group">
                <label for="name">Nome Completo</label>
                <input id="name" type="text" formControlName="name"
                placeholder="Digite seu nome"
                />
            </div>

            <div class="form-group">
                <label for="email">E-mail</label>
                <input id="email" type="email" formControlName="email" placeholder="Digite seu e-mail" />
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <input id="password" type="password" formControlName="password" placeholder="Digite sua senha" />
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirmar Senha</label>
                <input id="confirmPassword" type="password" formControlName="confirmPassword"
                    placeholder="Confirme sua senha" />
            </div>

            <div class="form-group">
                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Data de Nascimento</mat-label>

                    <input matInput [matDatepicker]="picker" placeholder="Selecione sua data de nascimento" formControlName="birthDate" />

                    <mat-datepicker-toggle matIconSuffix [for]="picker">
                    </mat-datepicker-toggle>

                    <mat-datepicker #picker></mat-datepicker>
                </mat-form-field>
            </div>

            <button type="submit">
                Criar Conta
            </button>

            <div class="footer">
                <span>Já possui uma conta?</span>
                <a routerLink="/login">Entrar</a>
            </div>
        </form>
    </div>
</div>
